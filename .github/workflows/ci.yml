name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Restore
        run: dotnet restore ScrumBoard.sln
      - name: Build
        run: dotnet build ScrumBoard.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ScrumBoard.sln --configuration Release --no-build --logger "trx" --results-directory artifacts/test-results --collect:"XPlat Code Coverage"
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Angular tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
      - name: Production build
        run: npm run build -- --configuration production

  containers:
    name: Docker build and Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: scrumboard-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrator
          load: true
          tags: scrumboard-migrator:ci
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          tags: scrumboard-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scrumboard-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan migrator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scrumboard-migrator:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scrumboard-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
