name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Restore
        run: dotnet restore ScrumBoard.sln
      - name: Build
        run: dotnet build ScrumBoard.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ScrumBoard.sln --configuration Release --no-build --logger "trx" --results-directory artifacts/test-results --collect:"XPlat Code Coverage"
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Angular tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Test
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
      - name: Production build
        run: npm run build -- --configuration production

  e2e:
    name: Compose Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start and wait for the Compose stack
        run: docker compose --env-file .env.example up --build --detach --wait --wait-timeout 300
      - name: Run serialized demo E2E suite
        working-directory: frontend
        env:
          CI: true
          E2E_DEMO: true
        run: npx playwright test --project=chromium --workers=1
      - name: Collect Compose logs
        if: always()
        run: |
          mkdir -p artifacts/e2e
          docker compose --env-file .env.example logs --no-color > artifacts/e2e/compose.log
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-results
          path: |
            artifacts/e2e/compose.log
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop Compose stack
        if: always()
        run: docker compose --env-file .env.example down --remove-orphans

  containers:
    name: Docker build and Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: scrumboard-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build migrator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.migrator
          load: true
          tags: scrumboard-migrator:ci
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          tags: scrumboard-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scrumboard-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan migrator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scrumboard-migrator:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scrumboard-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate migration job Bicep
        run: az bicep build --file deploy/azure/migration-job.bicep --outfile /tmp/migration-job.json
      - name: Validate application Bicep
        run: az bicep build --file deploy/azure/apps.bicep --outfile /tmp/apps.json
      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
