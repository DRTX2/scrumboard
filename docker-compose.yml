name: scrumboard

services:
  database:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrumboard}
      POSTGRES_USER: ${POSTGRES_USER:-scrumboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    environment:
      ConnectionStrings__Database: Host=database;Port=5432;Database=${POSTGRES_DB:-scrumboard};Username=${POSTGRES_USER:-scrumboard};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    depends_on:
      database:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=database;Port=5432;Database=${POSTGRES_DB:-scrumboard};Username=${POSTGRES_USER:-scrumboard};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      Jwt__Issuer: ${JWT_ISSUER:?Define JWT_ISSUER in .env}
      Jwt__Audience: ${JWT_AUDIENCE:?Define JWT_AUDIENCE in .env}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Define JWT_SIGNING_KEY in .env}
      Jwt__LifetimeMinutes: ${JWT_LIFETIME_MINUTES:-30}
      Password__Pepper: ${PASSWORD_PEPPER:?Define PASSWORD_PEPPER in .env}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:8080}
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      database:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      APP_PORT: 8080
      API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:5000/api}
      HUB_URL: ${HUB_PUBLIC_URL:-http://localhost:5000/hubs/boards}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
